<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Сайт заблокирован</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .blocked-container {
      max-width: 500px;
      margin: 100px auto;
      padding: 30px;
      text-align: center;
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    
    .blocked-icon {
      font-size: 48px;
      color: #e74c3c;
      margin-bottom: 20px;
    }
    
    .unlock-form {
      margin: 20px 0;
    }
    
    .unlock-form input {
      padding: 10px;
      margin: 10px 0;
      width: 200px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 16px;
    }
    
    .back-button {
      margin-top: 20px;
    }
    
    .info-note {
      font-size: 12px;
      color: #7f8c8d;
      margin-top: 10px;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="blocked-container">
    <div class="blocked-icon">🔒</div>
    <h1>Сайт заблокирован</h1>
    <p>Доступ к сайту <strong id="blockedUrl"></strong> ограничен блокировщиком.</p>
    
    <div class="unlock-form">
      <input type="password" id="passwordInput" placeholder="Введите пароль для временного доступа">
      <br>
      <button id="unlockButton" class="btn btn-primary">Разрешить временный доступ</button>
      <button id="backButton" class="btn btn-secondary back-button">Вернуться назад</button>
    </div>
    
    <div class="info-note">
      * Сайт останется в списке заблокированных, но будет временно доступен
    </div>
    
    <div id="message" class="message"></div>
  </div>
  
  <script src="blocked.js"></script>
</body>
</html>
