<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="popup-container">
    <h3>Блокировщик сайтов</h3>
    
    <div class="status" id="status">
      <span id="statusText">Расширение активно</span>
    </div>
    
    <div class="stats">
      <div class="stat-item">
        <span class="stat-number" id="blockedCount">0</span>
        <span class="stat-label">заблокировано сайтов</span>
      </div>
      <div class="stat-item">
        <span class="stat-number" id="disabledCount">0</span>
        <span class="stat-label">временно разрешено</span>
      </div>
    </div>
    
    <div class="controls">
      <button id="toggleBlocking" class="btn btn-primary">Включить блокировку</button>
      <button id="openOptions" class="btn btn-secondary">Настройки</button>
    </div>
    
    <div class="quick-action">
      <p>Для управления сайтами перейдите в настройки</p>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
